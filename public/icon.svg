<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#sakuraGrad)" />

  <!-- Inner Soft Card -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" filter="url(#shadow)" opacity="0.96" />

  <!-- Rising Sun Motif -->
  <circle cx="256" cy="256" r="100" fill="url(#sunGrad)" opacity="0.12" />

  <!-- Mount Fuji Silhouette -->
  <path d="M 128 360 L 220 220 L 292 220 L 384 360 Z" fill="#e2e8f0" />
  <path d="M 220 220 L 256 200 L 292 220 L 276 250 L 256 240 L 236 250 Z" fill="#ffffff" />
  <path d="M 150 360 L 220 220 L 256 200 L 292 220 L 362 360 Z" fill="none" stroke="#cbd5e1" stroke-width="3" />

  <!-- Torii Gate Accents / Stylized N5 / Kanji 桜 -->
  <text x="256" y="270" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', sans-serif" font-weight="900" font-size="110" fill="#e11d48" text-anchor="middle" dominant-baseline="middle">桜</text>

  <!-- Sakura Petals floating -->
  <path d="M 140 160 C 130 140, 160 130, 170 150 C 180 170, 150 180, 140 160 Z" fill="#f43f5e" opacity="0.75" />
  <path d="M 360 150 C 350 130, 380 120, 390 140 C 400 160, 370 170, 360 150 Z" fill="#fb7185" opacity="0.8" />
  <path d="M 370 320 C 360 305, 385 295, 395 310 C 405 325, 380 335, 370 320 Z" fill="#f43f5e" opacity="0.6" />

  <!-- JLPT N5 Badge bottom -->
  <rect x="176" y="380" width="160" height="36" rx="18" fill="#e11d48" />
  <text x="256" y="404" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">JLPT N5</text>
</svg>
